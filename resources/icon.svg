<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Warning triangle -->
  <polygon points="512,200 280,640 744,640" fill="none" stroke="#fbbf24" stroke-width="48" stroke-linejoin="round"/>
  <!-- Exclamation mark -->
  <rect x="488" y="360" width="48" height="140" rx="24" fill="#fbbf24"/>
  <circle cx="512" cy="560" r="28" fill="#fbbf24"/>
  <!-- Car silhouette at bottom -->
  <g transform="translate(512, 800)">
    <!-- Car body -->
    <path d="M -160,20 Q -160,-40 -100,-40 L -60,-40 L -30,-80 L 30,-80 L 60,-40 L 100,-40 Q 160,-40 160,20 L 160,50 Q 160,70 140,70 L 120,70 L 120,80 Q 120,100 100,100 L 80,100 Q 60,100 60,80 L 60,70 L -60,70 L -60,80 Q -60,100 -80,100 L -100,100 Q -120,100 -120,80 L -120,70 L -140,70 Q -160,70 -160,50 Z" fill="url(#carGrad)"/>
    <!-- Windows -->
    <path d="M -90,-30 L -55,-70 L 0,-70 L 0,-30 Z" fill="#1e293b" opacity="0.6"/>
    <path d="M 10,-30 L 10,-70 L 55,-70 L 90,-30 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Headlights -->
    <circle cx="140" cy="-10" r="8" fill="#fde047"/>
    <circle cx="-140" cy="-10" r="8" fill="#fde047"/>
  </g>
</svg>
